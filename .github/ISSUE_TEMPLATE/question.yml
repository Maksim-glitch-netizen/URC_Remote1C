name: "❓ Задать вопрос"
description: "Вопросы об установке, настройке или использовании URC_Remote1C"
title: "[Вопрос]: "
body:
  - type: markdown
    attributes:
      value: |
        Задавайте вопросы о работе URC_Remote1C. Автор и другие участники смогут отвечать в комментариях.
        Не публикуйте пароли, токены и конфиденциальные данные.
  - type: dropdown
    id: topic
    attributes:
      label: Тема вопроса
      options:
        - Установка и публикация HTTP-сервиса
        - Подключение и безопасность
        - API и примеры BSL
        - Чтение и запись данных
        - ХранилищеЗначения
        - Именованные процедуры
        - Другое
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Ваш вопрос
      description: "Опишите, что вы хотите сделать и что уже пробовали."
    validations:
      required: true
